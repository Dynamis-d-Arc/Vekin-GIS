services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vekin-gis-postgis
    environment:
      POSTGRES_USER: vekin
      POSTGRES_PASSWORD: vekin
      POSTGRES_DB: vekin_gis
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vekin -d vekin_gis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis-data:

